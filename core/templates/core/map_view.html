<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nepal Ward Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #map { height: 600px; width: 100%; margin-top: 20px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h2>Nepal Ward Map</h2>
    State: {{ state|default:"All" }}<br>
    District: {{ district|default:"All" }}<br>
    GaPa: {{ gapa|default:"All" }}<br>
    Ward Number: {{ ward|default:"All" }}

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([28.3949, 84.1240], 7);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const params = new URLSearchParams();
        {% if state %}    params.append("state",    "{{ state }}"); {% endif %}
        {% if district %} params.append("district", "{{ district }}"); {% endif %}
        {% if gapa %}     params.append("gapa",     "{{ gapa }}"); {% endif %}
        {% if ward %}     params.append("ward",     "{{ ward }}"); {% endif %}

        fetch(`/api/wards/?${params.toString()}`)
            .then(res => res.json())
            .then(data => {
                if (!data.features?.length) return;
                const layer = L.geoJSON(data, {
                    style: {
                        color: "#e63946",
                        weight: 1.5,
                        fillColor: "#e63946",
                        fillOpacity: 0.25
                    },
                    onEachFeature: (feature, layer) => {
                        const p = feature.properties;
                        layer.bindPopup(`
                            <b>${p.gapa_napa}</b><br>
                            Ward: ${p.ward_number}<br>
                            District: ${p.district}<br>
                            Type: ${p.type_gn}<br>
                            Area: ${p.area_sqkm?.toFixed(2)} km²
                        `);
                    }
                }).addTo(map);
                map.fitBounds(layer.getBounds());
            })
            .catch(err => console.error("Failed:", err));
    </script>
</body>
</html>
